<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <style>
      .sans { font-family: "Noto Sans TC", "Source Han Sans TC", sans-serif; }
      .serif { font-family: "Noto Serif TC", "Source Han Serif TC", serif; }
