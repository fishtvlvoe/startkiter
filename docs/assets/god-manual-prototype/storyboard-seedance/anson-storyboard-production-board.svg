  <text x="1230" y="1455" text-anchor="end" class="sans shot-time">85mm｜長焦近景</text>
  <image href="shot-04-real-need.png" x="80" y="1496" width="650" height="366" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot4)"/>
  <text x="758" y="1525" class="sans shot-title">客戶說出真正困擾</text>
  <text x="758" y="1568" class="sans shot-detail">
    <tspan x="758" dy="0"><tspan font-weight="700">運鏡｜</tspan>85mm 反打特寫，固定鏡頭</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">台詞｜</tspan>「我只想讓客人看懂、預約。」</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">表演｜</tspan>手臂鬆開、肩膀下降、語速變慢</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">視線｜</tspan>先看手機，再回到 PM</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">打光｜</tspan>自然窗光，臉部陰影逐步柔和</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">音效｜</tspan>手機輕觸聲、自然咖啡店底噪</tspan>
    <tspan x="758" dy="40"><tspan font-weight="700">承接｜</tspan>手指留在手機；PM 拉近筆電</tspan>
  </text>
  <rect x="80" y="1887" width="1150" height="178" rx="8" fill="#f0fdf4"/>
  <text x="106" y="1927" class="sans shot-meta" fill="#065f46">案神在做什麼</text>
  <text x="106" y="1964" class="sans shot-copy">
    <tspan x="106" dy="0">把表面需求翻成可執行需求：</tspan>
    <tspan x="106" dy="31">先讓客戶看懂服務、完成預約與開始收單。</tspan>
  </text>

