      .subtitle { font-size: 27px; font-weight: 500; fill: #475569; }
      .section { font-size: 30px; font-weight: 700; fill: #ffffff; }
      .label { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 23px; font-weight: 400; fill: #334155; }
      .small { font-size: 20px; font-weight: 400; fill: #475569; }
      .tiny { font-size: 18px; font-weight: 500; fill: #64748b; }
