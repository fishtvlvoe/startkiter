<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>模版 demo — 服務型 SaaS</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--color-olive-50: oklch(98.8% 0.003 106.5);
				--color-olive-100: oklch(96.6% 0.005 106.5);
				--color-olive-200: oklch(93% 0.007 106.5);
				--color-olive-300: oklch(88% 0.011 106.6);
				--color-olive-400: oklch(73.7% 0.021 106.9);
				--color-olive-500: oklch(58% 0.031 107.3);
				--color-olive-600: oklch(46.6% 0.025 107.3);
				--color-olive-700: oklch(39.4% 0.023 107.4);
				--color-olive-800: oklch(28.6% 0.016 107.4);
				--color-olive-900: oklch(22.8% 0.013 107.4);
				--color-olive-950: oklch(15.3% 0.006 107.1);
				--color-red-400: oklch(70.4% 0.191 22.216);
				--color-red-700: oklch(50.5% 0.213 27.518);
				--color-yellow-500: oklch(79.5% 0.184 86.047);
				--color-yellow-700: oklch(55.4% 0.135 66.442);
				--color-green-400: oklch(79.2% 0.209 151.711);
				--color-green-800: oklch(44.8% 0.119 151.328);
				--color-white: #fff;

				--border: var(--color-olive-200);
				--input: var(--color-olive-200);
				--ring: var(--color-olive-400);
				--background: var(--color-olive-50);
				--foreground: var(--color-olive-950);
				--primary: var(--color-olive-950);
				--primary-foreground: var(--color-olive-50);
				--secondary: var(--color-olive-100);
				--secondary-foreground: var(--color-olive-900);
				--destructive: var(--color-red-700);
				--destructive-foreground: var(--color-white);
				--success: var(--color-green-800);
				--success-foreground: var(--color-white);
				--warning: var(--color-yellow-700);
				--warning-foreground: var(--color-white);
				--muted: var(--color-olive-100);
				--muted-foreground: var(--color-olive-600);
				--accent: var(--color-olive-100);
				--accent-foreground: var(--color-olive-900);
				--touch: oklch(0.51 0.12 128);
				--touch-foreground: oklch(0.99 0.01 128);
				--popover: var(--color-white);
				--popover-foreground: var(--color-olive-950);
				--card: var(--color-white);
				--card-foreground: var(--color-olive-950);
				--radius: 0.625rem;
				--font-sans: "Inter", "Noto Sans TC", sans-serif;
			}

			.dark {
				--border: var(--color-olive-800);
				--input: var(--color-olive-800);
				--ring: var(--color-olive-500);
				--background: var(--color-olive-950);
				--foreground: var(--color-olive-50);
				--primary: var(--color-olive-50);
				--primary-foreground: var(--color-olive-950);
				--secondary: var(--color-olive-800);
				--secondary-foreground: var(--color-olive-50);
				--destructive: var(--color-red-400);
				--destructive-foreground: var(--color-white);
				--success: var(--color-green-400);
				--success-foreground: var(--color-olive-950);
				--warning: var(--color-yellow-500);
				--warning-foreground: var(--color-olive-950);
				--muted: var(--color-olive-900);
				--muted-foreground: var(--color-olive-400);
				--accent: var(--color-olive-900);
				--accent-foreground: var(--color-olive-50);
				--touch: oklch(0.76 0.11 128);
				--touch-foreground: oklch(0.22 0.04 128);
				--popover: var(--color-olive-900);
				--popover-foreground: var(--color-olive-50);
				--card: var(--color-olive-900);
				--card-foreground: var(--color-olive-50);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				color-scheme: light;
			}

			html.dark {
				color-scheme: dark;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			body {
				background: var(--background);
				color: var(--foreground);
				font-family: var(--font-sans);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			.shell {
				display: grid;
				grid-template-columns: 14rem 1fr;
				min-height: 100vh;
			}

			@media (max-width: 800px) {
				.shell {
					grid-template-columns: 1fr;
				}

				.sidebar {
					border-right: 0;
					border-bottom: 1px solid var(--border);
				}
			}

			.sidebar {
				background: var(--card);
				border-right: 1px solid var(--border);
				padding: 1.25rem 1rem;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				font-weight: 650;
				margin-bottom: 1.5rem;
			}

			.dot {
				width: 0.7rem;
				height: 0.7rem;
				border-radius: 9999px;
				background: var(--primary);
			}

			.side-nav {
				display: grid;
				gap: 0.35rem;
			}

			.side-nav a {
				display: block;
				padding: 0.55rem 0.7rem;
				border-radius: var(--radius);
				color: var(--muted-foreground);
				font-size: 0.9rem;
			}

			.side-nav a[aria-current="page"] {
				background: var(--accent);
				color: var(--accent-foreground);
				font-weight: 600;
			}

			.main {
				padding: 1.5rem 1.75rem 2.5rem;
			}

			.note {
				margin: 0 0 1.25rem;
				padding: 0.75rem 1rem;
				border-left: 3px solid var(--primary);
				background: var(--muted);
				color: var(--muted-foreground);
				font-size: 0.85rem;
			}

			.header {
				display: flex;
				justify-content: space-between;
				align-items: end;
				gap: 1rem;
				margin-bottom: 1.5rem;
			}

			.header h1 {
				margin: 0;
				font-size: 1.6rem;
				letter-spacing: -0.03em;
			}

			.header p {
				margin: 0.35rem 0 0;
				color: var(--muted-foreground);
				font-size: 0.9rem;
			}

			.btn {
				height: 2.4rem;
				padding: 0 1rem;
				border: 0;
				border-radius: 9999px;
				background: var(--primary);
				color: var(--primary-foreground);
				font-weight: 600;
				cursor: pointer;
			}

			.mode-toggle {
				display: inline-flex;
				border: 1px solid var(--border);
				border-radius: 9999px;
				overflow: hidden;
				margin-left: 0.5rem;
			}

			.mode-toggle button {
				border: 0;
				background: transparent;
				color: var(--muted-foreground);
				padding: 0.3rem 0.65rem;
				cursor: pointer;
				font-size: 0.75rem;
			}

			.mode-toggle button[aria-pressed="true"] {
				background: var(--primary);
				color: var(--primary-foreground);
			}

			.stats {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.85rem;
				margin-bottom: 1.25rem;
			}

			@media (max-width: 800px) {
				.stats {
					grid-template-columns: 1fr;
				}
			}

			.stat {
				border: 1px solid var(--border);
				border-radius: calc(var(--radius) * 1.2);
				padding: 1rem;
				background: var(--card);
				color: var(--card-foreground);
			}

			.stat span {
				display: block;
				font-size: 0.75rem;
				color: var(--muted-foreground);
			}

			.stat strong {
				display: block;
				margin-top: 0.35rem;
				font-size: 1.45rem;
				letter-spacing: -0.03em;
			}

			.panels {
				display: grid;
				grid-template-columns: 1.4fr 1fr;
				gap: 0.85rem;
			}

			@media (max-width: 800px) {
				.panels {
					grid-template-columns: 1fr;
				}
			}

			.panel {
				border: 1px solid var(--border);
				border-radius: calc(var(--radius) * 1.2);
				padding: 1rem 1.1rem;
				background: var(--card);
				color: var(--card-foreground);
			}

			.panel h2 {
				margin: 0 0 0.75rem;
				font-size: 1rem;
			}

			.row {
				display: flex;
				justify-content: space-between;
				gap: 1rem;
				padding: 0.65rem 0;
				border-top: 1px solid var(--border);
				font-size: 0.875rem;
			}

			.row:first-of-type {
				border-top: 0;
			}

			.muted {
				color: var(--muted-foreground);
			}

			.pill {
				display: inline-flex;
				align-items: center;
				height: 1.4rem;
				padding: 0 0.5rem;
				border-radius: 9999px;
				background: var(--accent);
				color: var(--accent-foreground);
				font-size: 0.7rem;
				font-weight: 650;
			}

			.swatch-row {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin: 0 0 1rem;
			}

			.swatch {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.7rem;
				color: var(--muted-foreground);
			}

			.swatch i {
				display: inline-block;
				width: 1rem;
				height: 1rem;
				border-radius: 0.25rem;
				border: 1px solid var(--border);
			}
		</style>
		<script>
			(function () {
				var mode =
					new URLSearchParams(location.search).get("mode") ||
					localStorage.getItem("startkiter-demo-color-mode") ||
					"light";
				document.documentElement.classList.toggle("dark", mode === "dark");
			})();
			function setDemoColorMode(mode) {
				document.documentElement.classList.toggle("dark", mode === "dark");
				localStorage.setItem("startkiter-demo-color-mode", mode);
				document.querySelectorAll("[data-mode]").forEach(function (btn) {
					btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === mode));
				});
			}
		</script>
	</head>
	<body>
		<div class="shell">
			<aside class="sidebar">
				<div class="brand"><span class="dot" aria-hidden="true"></span>服務型 SaaS</div>
				<nav class="side-nav" aria-label="模版側欄">
					<a href="#" aria-current="page">儀表板</a>
					<a href="#">客服</a>
					<a href="#">帳號設定</a>
				</nav>
			</aside>
			<main class="main">
				<p class="note">
					SiteTemplate id: <code>service-saas</code> · token 來源
					<code>tooling/tailwind/theme.css</code>（不再自訂 emerald／zinc）
				</p>
				<div class="swatch-row" aria-label="色票抽樣">
					<span class="swatch"><i style="background: var(--primary)"></i>primary</span>
					<span class="swatch"><i style="background: var(--background)"></i>background</span>
					<span class="swatch"><i style="background: var(--card)"></i>card</span>
					<span class="swatch"><i style="background: var(--border)"></i>border</span>
					<span class="swatch"><i style="background: var(--muted)"></i>muted</span>
				</div>
				<div class="header">
					<div>
						<h1>今日營運概況</h1>
						<p>服務型產品站：看數字、回工單、改設定。</p>
					</div>
					<div>
						<button type="button" class="btn">開新工單</button>
						<div class="mode-toggle" role="group" aria-label="顏色模式" style="display: inline-flex; vertical-align: middle">
							<button type="button" data-mode="light" aria-pressed="true" onclick="setDemoColorMode('light')">
								Light
							</button>
							<button type="button" data-mode="dark" aria-pressed="false" onclick="setDemoColorMode('dark')">
								Dark
							</button>
						</div>
					</div>
				</div>
				<section class="stats" aria-label="關鍵數字">
					<div class="stat"><span>活躍帳號</span><strong>128</strong></div>
					<div class="stat"><span>待回覆客服</span><strong>7</strong></div>
					<div class="stat"><span>本週轉換</span><strong>12%</strong></div>
				</section>
				<section class="panels">
					<div class="panel">
						<h2>最近活動</h2>
						<div class="row"><span>新用戶完成 onboarding</span><span class="muted">12 分鐘前</span></div>
						<div class="row"><span>客服工單 #492 已指派</span><span class="muted">1 小時前</span></div>
						<div class="row"><span>設定頁更新通知模板</span><span class="muted">昨天</span></div>
					</div>
					<div class="panel">
						<h2>快捷入口</h2>
						<div class="row"><span>客服收件匣</span><span class="pill">7 未讀</span></div>
						<div class="row"><span>帳號與安全</span><span class="muted">設定</span></div>
						<div class="row"><span>整合狀態</span><span class="muted">正常</span></div>
					</div>
				</section>
			</main>
		</div>
		<script>
			setDemoColorMode(document.documentElement.classList.contains("dark") ? "dark" : "light");
		</script>
	</body>
</html>
