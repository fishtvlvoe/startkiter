<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>模版 demo — 作品集展示</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--color-olive-50: oklch(98.8% 0.003 106.5);
				--color-olive-100: oklch(96.6% 0.005 106.5);
				--color-olive-200: oklch(93% 0.007 106.5);
				--color-olive-300: oklch(88% 0.011 106.6);
				--color-olive-400: oklch(73.7% 0.021 106.9);
				--color-olive-500: oklch(58% 0.031 107.3);
				--color-olive-600: oklch(46.6% 0.025 107.3);
				--color-olive-700: oklch(39.4% 0.023 107.4);
				--color-olive-800: oklch(28.6% 0.016 107.4);
				--color-olive-900: oklch(22.8% 0.013 107.4);
				--color-olive-950: oklch(15.3% 0.006 107.1);
				--color-red-400: oklch(70.4% 0.191 22.216);
				--color-red-700: oklch(50.5% 0.213 27.518);
				--color-yellow-500: oklch(79.5% 0.184 86.047);
				--color-yellow-700: oklch(55.4% 0.135 66.442);
				--color-green-400: oklch(79.2% 0.209 151.711);
				--color-green-800: oklch(44.8% 0.119 151.328);
				--color-white: #fff;

				--border: var(--color-olive-200);
				--input: var(--color-olive-200);
				--ring: var(--color-olive-400);
				--background: var(--color-olive-50);
				--foreground: var(--color-olive-950);
				--primary: var(--color-olive-950);
				--primary-foreground: var(--color-olive-50);
				--secondary: var(--color-olive-100);
				--secondary-foreground: var(--color-olive-900);
				--destructive: var(--color-red-700);
				--destructive-foreground: var(--color-white);
				--success: var(--color-green-800);
				--success-foreground: var(--color-white);
				--warning: var(--color-yellow-700);
				--warning-foreground: var(--color-white);
				--muted: var(--color-olive-100);
				--muted-foreground: var(--color-olive-600);
				--accent: var(--color-olive-100);
				--accent-foreground: var(--color-olive-900);
				--touch: oklch(0.51 0.12 128);
				--touch-foreground: oklch(0.99 0.01 128);
				--popover: var(--color-white);
				--popover-foreground: var(--color-olive-950);
				--card: var(--color-white);
				--card-foreground: var(--color-olive-950);
				--radius: 0.625rem;
				--font-sans: "Inter", "Noto Sans TC", sans-serif;
			}

			.dark {
				--border: var(--color-olive-800);
				--input: var(--color-olive-800);
				--ring: var(--color-olive-500);
				--background: var(--color-olive-950);
				--foreground: var(--color-olive-50);
				--primary: var(--color-olive-50);
				--primary-foreground: var(--color-olive-950);
				--secondary: var(--color-olive-800);
				--secondary-foreground: var(--color-olive-50);
				--destructive: var(--color-red-400);
				--destructive-foreground: var(--color-white);
				--success: var(--color-green-400);
				--success-foreground: var(--color-olive-950);
				--warning: var(--color-yellow-500);
				--warning-foreground: var(--color-olive-950);
				--muted: var(--color-olive-900);
				--muted-foreground: var(--color-olive-400);
				--accent: var(--color-olive-900);
				--accent-foreground: var(--color-olive-50);
				--touch: oklch(0.76 0.11 128);
				--touch-foreground: oklch(0.22 0.04 128);
				--popover: var(--color-olive-900);
				--popover-foreground: var(--color-olive-50);
				--card: var(--color-olive-900);
				--card-foreground: var(--color-olive-50);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				color-scheme: light;
			}

			html.dark {
				color-scheme: dark;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			body {
				background:
					radial-gradient(circle at top left, color-mix(in oklch, var(--primary) 8%, transparent), transparent 42%),
					var(--background);
				color: var(--foreground);
				font-family: var(--font-sans);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			.wrap {
				width: min(68rem, calc(100% - 2rem));
				margin-inline: auto;
				padding-bottom: 3.5rem;
			}

			.topbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 1.25rem 0;
			}

			.brand {
				font-weight: 650;
				letter-spacing: -0.03em;
			}

			.nav {
				display: flex;
				align-items: center;
				gap: 1.1rem;
				font-size: 0.875rem;
				color: var(--muted-foreground);
			}

			.mode-toggle {
				display: inline-flex;
				border: 1px solid var(--border);
				border-radius: 9999px;
				overflow: hidden;
			}

			.mode-toggle button {
				border: 0;
				background: transparent;
				color: var(--muted-foreground);
				padding: 0.3rem 0.65rem;
				cursor: pointer;
				font-size: 0.75rem;
			}

			.mode-toggle button[aria-pressed="true"] {
				background: var(--primary);
				color: var(--primary-foreground);
			}

			.note {
				margin: 0 0 1.5rem;
				padding: 0.75rem 1rem;
				border-left: 3px solid var(--primary);
				background: var(--muted);
				color: var(--muted-foreground);
				font-size: 0.85rem;
			}

			.swatch-row {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin: 0 0 1rem;
			}

			.swatch {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.7rem;
				color: var(--muted-foreground);
			}

			.swatch i {
				display: inline-block;
				width: 1rem;
				height: 1rem;
				border-radius: 0.25rem;
				border: 1px solid var(--border);
			}

			.intro {
				padding: 2.5rem 0 2rem;
				max-width: 34rem;
			}

			.intro h1 {
				margin: 0;
				font-size: clamp(2.2rem, 5vw, 3.4rem);
				font-weight: 550;
				letter-spacing: -0.05em;
				line-height: 1.08;
			}

			.intro p {
				margin: 0.9rem 0 0;
				color: var(--muted-foreground);
				font-size: 1.05rem;
			}

			.cta {
				display: inline-flex;
				margin-top: 1.35rem;
				height: 2.6rem;
				padding: 0 1.15rem;
				align-items: center;
				border-radius: 9999px;
				background: var(--primary);
				color: var(--primary-foreground);
				font-weight: 600;
			}

			.wall {
				display: grid;
				grid-template-columns: 1.2fr 1fr 1fr;
				grid-auto-rows: 11rem;
				gap: 0.85rem;
			}

			@media (max-width: 800px) {
				.wall {
					grid-template-columns: 1fr;
					grid-auto-rows: 10rem;
				}

				.span-2 {
					grid-column: auto;
					grid-row: auto;
				}
			}

			.tile {
				position: relative;
				overflow: hidden;
				border-radius: calc(var(--radius) * 1.3);
				border: 1px solid var(--border);
				background: var(--card);
				padding: 1rem;
				display: flex;
				flex-direction: column;
				justify-content: end;
			}

			.span-2 {
				grid-column: span 1;
				grid-row: span 2;
			}

			.tile::before {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(180deg, transparent 35%, color-mix(in oklch, var(--foreground) 70%, transparent));
				opacity: 0.95;
				pointer-events: none;
			}

			.tile.a {
				background: linear-gradient(135deg, var(--color-olive-300), var(--color-olive-50) 55%);
			}

			.tile.b {
				background: linear-gradient(160deg, var(--color-olive-400), var(--color-olive-100) 60%);
			}

			.tile.c {
				background: linear-gradient(200deg, var(--color-olive-600), var(--color-olive-200) 58%);
			}

			.tile.d {
				background: linear-gradient(120deg, var(--color-olive-900), var(--color-olive-400) 70%);
			}

			.tile h2,
			.tile p {
				position: relative;
				margin: 0;
				color: var(--color-olive-50);
			}

			.tile h2 {
				font-size: 1.05rem;
				letter-spacing: -0.02em;
			}

			.tile p {
				margin-top: 0.25rem;
				font-size: 0.8rem;
				opacity: 0.9;
			}
		</style>
		<script>
			(function () {
				var mode =
					new URLSearchParams(location.search).get("mode") ||
					localStorage.getItem("startkiter-demo-color-mode") ||
					"light";
				document.documentElement.classList.toggle("dark", mode === "dark");
			})();
			function setDemoColorMode(mode) {
				document.documentElement.classList.toggle("dark", mode === "dark");
				localStorage.setItem("startkiter-demo-color-mode", mode);
				document.querySelectorAll("[data-mode]").forEach(function (btn) {
					btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === mode));
				});
			}
		</script>
	</head>
	<body>
		<div class="wrap">
			<header class="topbar">
				<div class="brand">作品集展示</div>
				<nav class="nav" aria-label="模版導覽">
					<a href="#">作品</a>
					<a href="#">關於</a>
					<a href="#">聯絡</a>
					<div class="mode-toggle" role="group" aria-label="顏色模式">
						<button type="button" data-mode="light" aria-pressed="true" onclick="setDemoColorMode('light')">
							Light
						</button>
						<button type="button" data-mode="dark" aria-pressed="false" onclick="setDemoColorMode('dark')">
							Dark
						</button>
					</div>
				</nav>
			</header>

			<p class="note">
				SiteTemplate id: <code>portfolio</code> · token 來源
				<code>tooling/tailwind/theme.css</code>（作品牆漸層也只用 olive 階）
			</p>

			<div class="swatch-row" aria-label="色票抽樣">
				<span class="swatch"><i style="background: var(--primary)"></i>primary</span>
				<span class="swatch"><i style="background: var(--background)"></i>background</span>
				<span class="swatch"><i style="background: var(--card)"></i>card</span>
				<span class="swatch"><i style="background: var(--border)"></i>border</span>
				<span class="swatch"><i style="background: var(--muted)"></i>muted</span>
			</div>

			<section class="intro">
				<h1>用作品說話的落地頁</h1>
				<p>大圖牆、少干擾。適合個人品牌、工作室、案例展示站。</p>
				<a class="cta" href="#">看精選作品</a>
			</section>

			<section class="wall" aria-label="作品牆">
				<article class="tile a span-2">
					<h2>品牌重構專案</h2>
					<p>識別系統 × 官網改版</p>
				</article>
				<article class="tile b">
					<h2>產品發表頁</h2>
					<p>單頁轉換</p>
				</article>
				<article class="tile c">
					<h2>活動視覺</h2>
					<p>主視覺系列</p>
				</article>
				<article class="tile d">
					<h2>操作系統</h2>
					<p>操作介面</p>
				</article>
			</section>
		</div>
		<script>
			setDemoColorMode(document.documentElement.classList.contains("dark") ? "dark" : "light");
		</script>
	</body>
</html>
