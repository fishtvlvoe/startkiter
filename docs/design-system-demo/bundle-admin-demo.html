<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartKiter Admin - 課程綁定包管理 (Bundle Admin Demo)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
  <style>
    :root {
      --wp-bar: #1d2327; --wp-bar-hover: #2c3338; --wp-bar-active: #13171a;
      --wp-accent: #2271b1; --wp-accent-hover: #135e96; --wp-accent-soft: #72aee6;
      --wp-content-bg: #f0f0f1; --wp-ink: #1d2327; --wp-ink-soft: #2c3338;
      --wp-line: #c3c4c7; --wp-table-head: #f6f7f7;
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
      --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569; --slate-700: #334155;
      --slate-800: #1e293b; --slate-900: #0f172a;
      --emerald-50: #ecfdf5; --emerald-200: #a7f3d0; --emerald-500: #10b981; --emerald-700: #047857;
      --rose-50: #fff1f2; --rose-200: #fecdd3; --rose-600: #e11d48;
      --amber-300: #fcd34d; --amber-700-40: rgba(180,83,9,0.4); --amber-900-40: rgba(120,53,15,0.4);
      --indigo-600: #4f46e5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--wp-content-bg); color: var(--wp-ink-soft); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

    /* admin bar */
    .admin-bar { background: var(--wp-bar); color: #c3c4c7; font-size: 0.6875rem; height: 2rem; padding: 0 0.75rem; display: flex; align-items: center; justify-content: space-between; z-index: 50; position: sticky; top: 0; border-bottom: 1px solid rgba(0,0,0,0.4); user-select: none; }
    .admin-bar-left { display: flex; align-items: center; gap: 0.5rem; }
    .mobile-toggle { display: none; background: none; border: none; padding: 0.25rem; color: #cbd5e1; }
    .mobile-toggle:hover { color: #fff; }
    .brand-mark { font-weight: 900; font-size: 0.75rem; color: #fff; }
    .site-switcher { position: relative; padding: 0.25rem 0.375rem; border-radius: 0.125rem; display: flex; align-items: center; gap: 0.375rem; cursor: pointer; transition: background 0.15s; }
    .site-switcher:hover { background: var(--wp-bar-hover); color: #fff; }
    .site-switcher .icon { width: 10px; height: 10px; }
    .site-switcher span.label { font-weight: 700; color: #fff; display: none; }
    .site-menu { position: absolute; left: 0; top: 100%; margin-top: 0; width: 12rem; background: var(--wp-bar-hover); border: 1px solid rgba(0,0,0,0.3); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); padding: 0.25rem 0; display: none; font-size: 0.75rem; z-index: 50; }
    .site-switcher:hover .site-menu { display: block; }
    .site-menu a { padding: 0.5rem 0.75rem; display: flex; align-items: center; gap: 0.5rem; color: #e2e8f0; }
    .site-menu a:hover { background: var(--wp-accent); color: #fff; }
    .site-menu .icon { width: 10px; height: 10px; }
    .bar-divider { height: 0.875rem; width: 1px; background: rgba(255,255,255,0.1); display: none; }
    .status-ok { font-size: 0.625rem; color: var(--emerald-500); display: none; align-items: center; gap: 0.25rem; }
    .status-dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--emerald-500); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .admin-bar-right { display: flex; align-items: center; gap: 0.75rem; }
    .mock-badge { padding: 0.125rem 0.5rem; border-radius: 0.25rem; background: var(--amber-900-40); color: var(--amber-300); font-size: 0.625rem; font-weight: 600; border: 1px solid var(--amber-700-40); }
    .user-chip { display: flex; align-items: center; gap: 0.375rem; color: #e2e8f0; font-weight: 500; }
    .user-chip .name { display: none; }
    .user-avatar { width: 1.25rem; height: 1.25rem; border-radius: 9999px; background: var(--indigo-600); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; font-weight: 700; }

    /* layout */
    .body-shell { flex: 1; display: flex; overflow: hidden; position: relative; }
    .sidebar { width: 13rem; background: var(--wp-bar); color: #c3c4c7; display: flex; flex-direction: column; flex-shrink: 0; user-select: none; border-right: 1px solid rgba(0,0,0,0.3); position: absolute; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); transition: transform 0.25s ease; }
    .sidebar-nav { flex: 1; padding: 0.5rem 0; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.75rem; overflow-y: auto; }
    .nav-group-label { padding: 0.375rem 0.75rem 0.25rem; font-size: 0.625rem; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.05em; }
    .nav-items { display: flex; flex-direction: column; gap: 0.125rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.875rem; transition: background 0.15s, color 0.15s; }
    .nav-item .icon { width: 14px; color: var(--slate-400); text-align: center; }
    .nav-item:hover { background: var(--wp-bar-active); color: var(--wp-accent-soft); }
    .nav-item.active { background: var(--wp-accent) !important; color: #fff !important; font-weight: 600; }
    .nav-item.active .icon { color: #fff; }
    .nav-item .sub { font-size: 0.625rem; opacity: 0.6; }
    .mobile-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; display: none; }
    main.content { flex: 1; padding: 1rem; overflow-y: auto; }

    @media (min-width: 768px) {
      .mobile-toggle { display: none !important; }
      .bar-divider { display: block; }
      .status-ok { display: flex; }
      .user-chip .name { display: inline; }
      .sidebar { position: static; transform: none; }
      main.content { padding: 1.5rem; }
    }
    @media (min-width: 640px) {
      .site-switcher span.label { display: inline; }
    }

    /* content: list view */
    .view-head { display: flex; flex-direction: column; gap: 0.75rem; justify-content: space-between; margin-bottom: 1rem; }
    .view-head h1 { font-size: 1.125rem; font-weight: 700; color: var(--wp-ink); margin: 0; }
    .view-head p { font-size: 0.75rem; color: var(--slate-500); margin: 0.125rem 0 0; }
    .btn-new { padding: 0.375rem 1rem; background: var(--wp-accent); color: #fff; border: none; border-radius: 0.25rem; font-weight: 700; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.375rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); transition: background 0.15s; }
    .btn-new:hover { background: var(--wp-accent-hover); }
    .btn-new .icon { width: 10px; }
    @media (min-width: 640px) { .view-head { flex-direction: row; align-items: center; } }

    table.bundle-table { width: 100%; font-size: 0.75rem; border-collapse: collapse; }
    .table-wrap { background: #fff; border: 1px solid var(--wp-line); border-radius: 0.5rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); overflow: hidden; }
    table.bundle-table thead tr { background: var(--wp-table-head); border-bottom: 1px solid var(--wp-line); color: var(--slate-500); font-weight: 600; }
    table.bundle-table th { text-align: left; padding: 0.625rem 1rem; }
    table.bundle-table th:last-child { text-align: right; }
    table.bundle-table tbody tr { border-top: 1px solid var(--slate-100); transition: background 0.15s; }
    table.bundle-table tbody tr:hover { background: var(--slate-50); }
    table.bundle-table td { padding: 0.75rem 1rem; vertical-align: middle; }
    .bundle-title { font-weight: 700; color: var(--slate-900); }
    .bundle-slug { font-size: 0.6875rem; color: var(--slate-400); font-family: ui-monospace, monospace; }
    .course-count { padding: 0.125rem 0.375rem; border-radius: 0.25rem; background: var(--slate-100); font-family: ui-monospace, monospace; font-size: 0.6875rem; color: var(--slate-600); }
    .price-cell { font-weight: 700; color: var(--slate-800); }
    .status-pill { font-size: 0.625rem; padding: 0.125rem 0.5rem; border-radius: 0.25rem; border: 1px solid; font-weight: 700; }
    .status-draft { background: var(--slate-100); color: var(--slate-600); border-color: var(--slate-200); }
    .status-published { background: var(--emerald-50); color: var(--emerald-700); border-color: var(--emerald-200); }
    .status-archived { background: var(--rose-50); color: var(--rose-600); border-color: var(--rose-200); }
    .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.25rem; }
    .icon-btn { padding: 0.375rem; background: none; border: none; border-radius: 0.25rem; color: var(--slate-500); transition: background 0.15s, color 0.15s; display: inline-flex; }
    .icon-btn:hover { background: var(--slate-100); color: var(--wp-accent); }
    .icon-btn.danger:hover { color: var(--rose-600); }
    .icon-btn .icon { width: 14px; height: 14px; }
    .empty-row td { padding: 2rem 1rem; text-align: center; color: var(--slate-400); }

    /* form view */
    .form-wrap { max-width: 42rem; display: flex; flex-direction: column; gap: 1rem; }
    .back-link { display: flex; align-items: center; gap: 0.25rem; background: none; border: none; color: var(--slate-500); font-size: 0.75rem; font-weight: 600; padding: 0; }
    .back-link:hover { color: var(--wp-accent); }
    .back-link .icon { width: 10px; }
    .form-wrap h1 { font-size: 1.125rem; font-weight: 700; color: var(--wp-ink); margin: 0; }
    form.bundle-form { background: #fff; border: 1px solid var(--wp-line); border-radius: 0.5rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; font-size: 0.75rem; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 768px) { .form-grid-2 { grid-template-columns: 1fr 1fr; } }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field label { font-weight: 700; color: var(--slate-700); }
    .field input, .field select, .field textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--slate-300); border-radius: 0.25rem; background: #fff; font-size: inherit; color: var(--slate-900); }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--wp-accent); }
    .field input.mono { font-family: ui-monospace, monospace; }
    .field .hint { font-size: 0.625rem; color: var(--slate-400); margin: 0; }
    .field textarea { resize: none; }
    .checklist { border: 1px solid var(--slate-200); border-radius: 0.5rem; }
    .checklist label { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.75rem; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--slate-100); }
    .checklist label:last-child { border-bottom: none; }
    .checklist label:hover { background: var(--slate-50); }
    .checklist input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--wp-accent); }
    .checklist .ctitle { color: var(--slate-800); font-weight: 500; }
    .checklist .cid { font-size: 0.625rem; color: var(--slate-400); font-family: ui-monospace, monospace; margin-left: auto; }
    .form-actions { display: flex; align-items: center; justify-content: space-between; padding-top: 0.5rem; border-top: 1px solid var(--slate-100); }
    .btn-cancel { padding: 0.5rem 1rem; border: 1px solid var(--slate-300); border-radius: 0.25rem; background: #fff; font-weight: 700; color: var(--slate-700); }
    .btn-cancel:hover { background: var(--slate-50); }
    .btn-save { padding: 0.5rem 1.5rem; background: var(--wp-accent); color: #fff; font-weight: 700; border: none; border-radius: 0.25rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
    .btn-save:hover { background: var(--wp-accent-hover); }
  </style>
</head>
<body>

      <button class="mobile-toggle" onclick="toggleMobileSidebar()" aria-label="開關選單">

  <!-- 2. WordPress 雙欄佈局 -->
  <div class="body-shell">
    <aside id="wp-sidebar" class="sidebar">
      <nav class="sidebar-nav">

          <div class="nav-group-label">核心控制 CORE</div>
          <div class="nav-items">

              <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="7" height="7"/><rect x="13" y="12" width="7" height="7"/><rect x="8.5" y="4" width="7" height="7"/></svg>

  <script>
    const ICONS = {
      plus: '<svg class="icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
      pen: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
      trash: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg>',
      back: '<svg class="icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>'
    };

    // 假資料：既有課程目錄（供 courseIds 多選）
    const courseCatalog = [
      { id: "c-nextjs", title: "Next.js 全端班" },
      { id: "c-react-adv", title: "React 進階班" },
      { id: "c-copywriting", title: "AI 文案寫作術" },
      { id: "c-startkiter", title: "StartKiter 開站包實戰全套課" }
    ];

    // 假資料：Bundle 列表（對應 design.md 的 Bundle 型別）
    let bundles = [
      {
        id: "bd-1", slug: "fullstack-combo", title: "Next.js 全端班 + React 進階班",
        description: "打包全端與前端進階兩堂課，組合價比分開買便宜 2200 元。",
        priceTwd: 12800, status: "published", courseIds: ["c-nextjs", "c-react-adv"]
      },
      {
        id: "bd-2", slug: "writer-dev-combo", title: "文案 + 全端雙修組合",
        description: "適合想同時經營內容與產品的創業者。",
        priceTwd: 15800, status: "draft", courseIds: ["c-copywriting", "c-nextjs"]
      },
      {
        id: "bd-3", slug: "old-promo", title: "舊活動組合包（已下架）",
        description: "2025 年活動限定組合，已下架不再對外銷售。",
        priceTwd: 9900, status: "archived", courseIds: ["c-startkiter"]
      }
    ];

    let currentView = "list";
    let editingBundle = null; // null = 新增模式；否則為編輯中的 bundle 物件

    const statusMeta = {
      draft: { label: "草稿", cls: "status-draft" },
      published: { label: "已發布", cls: "status-published" },
      archived: { label: "已下架", cls: "status-archived" }
    };

    function courseTitle(id) {
      const c = courseCatalog.find(c => c.id === id);
      return c ? c.title : id;
    }

    function switchView(view) {
      currentView = view;
      render();
    }

    function openNewBundle() {
      editingBundle = { id: null, slug: "", title: "", description: "", priceTwd: 0, status: "draft", courseIds: [] };
      currentView = "form";
      render();
    }

    function openEditBundle(id) {
      const b = bundles.find(b => b.id === id);
      editingBundle = JSON.parse(JSON.stringify(b));
      currentView = "form";
      render();
    }

    function deleteBundle(id) {
      const b = bundles.find(b => b.id === id);
      if (confirm('確定要刪除組合包《' + b.title + '》嗎？此操作僅為 Demo 展示，不會真的送出刪除請求。')) {
        bundles = bundles.filter(b => b.id !== id);
        render();
      }
    }

    function saveBundle(e) {
      e.preventDefault();
      const form = e.target;
      const title = form.title.value.trim();
      const slug = form.slug.value.trim();
      const priceTwd = parseInt(form.priceTwd.value, 10) || 0;
      const description = form.description.value.trim();
      const status = form.status.value;
      const courseIds = Array.from(form.querySelectorAll('input[name="courseIds"]:checked')).map(el => el.value);

      if (!title || !slug || courseIds.length === 0) {
        alert('標題、Slug、至少選一堂課為必填');
        return;
      }

      if (editingBundle.id) {
        const idx = bundles.findIndex(b => b.id === editingBundle.id);
        bundles[idx] = { ...editingBundle, title, slug, priceTwd, description, status, courseIds };
      } else {
        bundles.push({ id: "bd-" + Date.now(), title, slug, priceTwd, description, status, courseIds });
      }

      alert('💾 組合包已儲存（Demo 假資料，未串接真實 API）');
      editingBundle = null;
      currentView = "list";
      render();
    }

    function render() {
      const container = document.getElementById('dynamic-content');

      if (currentView === "list") {
        container.innerHTML = `
          <div>
            <div class="view-head">
              <div>
                <h1>課程綁定包</h1>
                <p>把多堂課組成一個組合價商品，可套用優惠券折扣。</p>
              </div>
              <button onclick="openNewBundle()" class="btn-new">${ICONS.plus} <span>新增組合包</span></button>
            </div>

            <div class="table-wrap">
              <table class="bundle-table">
                <thead>
                  <tr>
                    <th>組合包</th>
                    <th>內含課程</th>
                    <th>組合價</th>
                    <th>狀態</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${bundles.map(b => `
                    <tr>
                      <td>
                        <div class="bundle-title">${b.title}</div>
                        <div class="bundle-slug">/${b.slug}</div>
                      </td>
                      <td>
                        <span class="course-count">${b.courseIds.length} 堂課</span>
                      </td>
                      <td class="price-cell">NT$ ${b.priceTwd.toLocaleString()}</td>
                      <td>
                        <span class="status-pill ${statusMeta[b.status].cls}">${statusMeta[b.status].label}</span>
                      </td>
                      <td>
                        <div class="row-actions">
                          <button onclick="openEditBundle('${b.id}')" class="icon-btn" title="編輯組合包">${ICONS.pen}</button>
                          <button onclick="deleteBundle('${b.id}')" class="icon-btn danger" title="刪除組合包">${ICONS.trash}</button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                  ${bundles.length === 0 ? `<tr class="empty-row"><td colspan="5">尚無組合包，點右上角「新增組合包」建立第一個</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentView === "form") {
        const b = editingBundle;
        const isNew = !b.id;
        container.innerHTML = `
          <div class="form-wrap">
            <button onclick="switchView('list')" class="back-link">${ICONS.back} <span>返回列表</span></button>
            <h1>${isNew ? '新增組合包' : '編輯組合包：' + b.title}</h1>

            <form id="bundle-form" onsubmit="saveBundle(event)" class="bundle-form">
              <div class="form-grid-2">
                <div class="field">
                  <label>標題 *</label>
                  <input name="title" type="text" value="${b.title}" required placeholder="例如：Next.js 全端班 + React 進階班">
                </div>
                <div class="field">
                  <label>Slug *</label>
                  <input name="slug" type="text" value="${b.slug}" required placeholder="fullstack-combo" class="mono">
                  <p class="hint">前台網址：/bundles/${b.slug || '&lt;slug&gt;'}</p>
                </div>
              </div>

              <div class="field">
                <label>說明</label>
                <textarea name="description" rows="3" placeholder="這個組合包適合誰、能省多少錢">${b.description}</textarea>
              </div>

              <div class="form-grid-2">
                <div class="field">
                  <label>組合價 (TWD) *</label>
                  <input name="priceTwd" type="number" min="0" step="1" value="${b.priceTwd}" required class="mono">
                </div>
                <div class="field">
                  <label>狀態</label>
                  <select name="status">
                    <option value="draft" ${b.status === 'draft' ? 'selected' : ''}>草稿（不對外顯示）</option>
                    <option value="published" ${b.status === 'published' ? 'selected' : ''}>已發布（前台可購買）</option>
                    <option value="archived" ${b.status === 'archived' ? 'selected' : ''}>已下架</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <label>內含課程 * <span style="font-weight:400;color:var(--slate-400)">（至少選 1 堂）</span></label>
                <div class="checklist">
                  ${courseCatalog.map(c => `
                    <label>
                      <input type="checkbox" name="courseIds" value="${c.id}" ${b.courseIds.includes(c.id) ? 'checked' : ''}>
                      <span class="ctitle">${c.title}</span>
                      <span class="cid">${c.id}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <div class="form-actions">
                <button type="button" onclick="switchView('list')" class="btn-cancel">取消</button>
                <button type="submit" class="btn-save">儲存組合包</button>
              </div>
            </form>
          </div>
        `;
      }
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('wp-sidebar');
      const backdrop = document.getElementById('mobile-backdrop');
      sidebar.classList.toggle('open');
      if (sidebar.classList.contains('open')) {
        sidebar.style.transform = 'translateX(0)';
        backdrop.style.display = 'block';
      } else {
        sidebar.style.transform = '';
        backdrop.style.display = 'none';
      }
    }

    render();
  </script>
</body>
</html>
