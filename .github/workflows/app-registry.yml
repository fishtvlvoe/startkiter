name: App registry contract

on:
	pull_request:
		paths:
			- ".github/workflows/app-registry.yml"
			- "packages/platform/src/app-registration.ts"
			- "packages/platform/src/app-registry-ci.test.ts"
			- "packages/platform/src/workspace/registry.ts"
		push:
		paths:
			- ".github/workflows/app-registry.yml"
			- "packages/platform/src/app-registration.ts"
			- "packages/platform/src/app-registry-ci.test.ts"
			- "packages/platform/src/workspace/registry.ts"

jobs:
	validate-app-registry:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			- uses: pnpm/action-setup@v4
				with:
					version: 11.20.0
			- uses: actions/setup-node@v4
				with:
					node-version: 22
					cache: pnpm
			- run: pnpm install --frozen-lockfile
			- run: pnpm --filter @startkiter/platform validate:app-registry
