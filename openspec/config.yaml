schema: spec-driven
context: |
  # 產品定位與現行狀態
  StartKiter（對外課名可用「開站包」）是課 + 終身代碼包。MVP 用這包自己的站賣課；課程是模組，不是整站唯一長相。
  結帳金額鎖 8800 TWD（不是區間）。主金流只接通 PAYUNi，一次買斷 TWD。付款後站內領 GitHub 組織私人倉庫只讀。
  站內 agent 可接模型，v1 只掛兩支唯讀工具。付費學員在課程內加入 LINE 交流群；客服走 Chatwoot 統一工單（網站/LINE/Telegram）。
  不是 libon.me 的一部分。
  `mvp-test-scope`、`extract-shell-auth`、`extract-payuni-checkout`、`extract-course-module`、`test-to-clean-package-promotion` 皆已封存。
  MVP extract 佇列已清空（site-agent／line／kit 皆封存）。`bootstrap-test-startkiter`／`mvp-sell-flow-usable` 已封存。TEST HTTPS：https://test-startkiter.vercel.app（Neon via Vercel；Git auto-deploy 已接通）。kit 真測需 GITHUB_KIT_ORG／REPO／完整 PEM。
  兩倉＋晉升規則 SSOT：openspec/specs/test-clean-package-promotion/ 與 docs/deploy-and-public-url.md。

  # 獨立專案
  - 路徑：products/startkiter（自己的 git repo）
  - 零耦合 libon.me：不准借它的網域、帳號、課、代碼
  - 不准改來源專案：supastarter-nextjs-main、THE-TU-Project、8-外掛/line-hub

  # 抽取來源（只讀；extract-site-agent 白名單）
  - 已落地：apps/saas、auth、payments、course、github-kit、database
  - 本刀白名單：packages/site-agent、/api/agent/chat、/agent UI、兩支唯讀工具
  - 不准註冊寫入工具；不准接通 Shopline／Stripe；不准抽發票

  # Tech Stack
  - Next.js App Router + React + TypeScript
  - Better Auth（email/password + Google + LINE socialProviders.line）
  - Prisma + PostgreSQL
  - 主金流 PAYUNi（一次買斷 TWD）；Shopline／Stripe 介面可留空位但不接線、不上課、不出現在結帳
  - 發票不在 MVP；下一輪才接 @paid-tw/einvoice*
  - i18n 起跳 zh-tw／zh-cn／en；cookie NEXT_LOCALE 切換，缺 key fallback zh-tw。本輪不做 /zh-tw URL 前綴與 middleware
  - 部署：常駐 Node（Zeabur 類）+ PostgreSQL + /data volume；預設不是 Vercel serverless

  # v1 硬邊界
  - 商品常數：startkiter-mvp 仍固定 8800 TWD 一次買斷；另提供 startkiter-mvp-subscription 訂閱方案（月繳/年繳，同一門課），2026-08-23 由 payuni-recurring-billing change 開放
  - 同一門課支援一次買斷與訂閱制並存，不做三階定價
  - Organization / Member / Invitation 為必要功能（公司行號客戶需要團隊帳號）；見 organization-tenancy capability
  - LINE Login Channel 做登入；學員社群用課程內 LINE 邀請連結，允許客服用途的 LINE Messaging，不做 LIFF / 行銷 Bot，不能靜默入群。客服走 Chatwoot 統一工單（網站/LINE/Telegram）
  - 金鑰填後台、env fallback；沒設金流必須 fail-closed（POST /api/checkout → 503，不是 500）
  - 發票不在 MVP

  # 已廢（不是現行規則）
  - 「不是賣課平台」已廢：官網即產品實例，自己賣課
  - 「主金流 SHOPLINE」已廢：MVP 只接通 PAYUNi
  - 「四堂課對 SHOPLINE」已廢：不走 SHOPLINE 測一筆付款解鎖
  - 「發票在 MVP」已廢
  - 「目前施工 extract-shell-auth」已廢：該 change 已封存
  - 「下一張施工 change 尚未開」已廢：已進入 bootstrap／extract 階段
  - 「現行待施工為 extract-github-kit-fulfillment」已廢：該 change 已封存
  - 「現行待施工 extract-payuni-checkout」已廢：該 change 已封存
  - 「現行待施工 extract-course-module」已廢：該 change 已封存
  - 「i18n 只留 zh-TW」已廢：多語系已起跳，zh-tw 是 fallback 不是唯一語言
  - 「客服走 email」「不做 Messaging」已廢：已由 unified-support-desk 改為 Chatwoot 統一工單（網站/LINE/Telegram）與客服用途 LINE Messaging

  # 程式碼規範
  - 程式碼英文、註解繁中
  - commit 用 conventional commits + 繁中描述
  - 禁止直接 push main；功能分支 feature/xxx
  - 產品現行邊界 SSOT：openspec/specs/；docs/discuss/ 是歷史討論，衝突時以 specs 為準

  # 網域
  - 優先 startkiter.com，備案 startkiter.me
  - 下單前再查 whois；沒買到先用 Zeabur 子網域，不准借 libon.me


rules:
  proposal:
    - 以繁體中文撰寫
    - Why 段落限 1-3 句話，說明問題與急迫性
    - What Changes 用 bullet list，每條以動詞起頭（新增/修改/移除），具體到檔案或模組層級
    - 破壞性變更必須加粗標示 **BREAKING**
    - Non-Goals 段落必填：明確列出本次不做的事，避免 scope creep
    - Capabilities 章節要與 specs/ 目錄的名稱完全一致（kebab-case）
    - Impact 段落必含：Affected specs、Affected code、Dependencies 新增、環境變數新增

  design:
    - 以繁體中文撰寫
    - 僅在以下情況建立：跨模組變更、新外部依賴、新資料模型、效能或安全複雜度高
    - Decisions 每條必須包含 Alternatives Considered（至少列 2 個被否決的方案 + 理由）
    - Risks / Trade-offs 用「[Risk] → Mitigation」格式
    - Migration Plan 必含部署步驟 + 回滾策略
    - 禁用「可能」「或許」「看情況」；不確定的事放進 Open Questions 明列
    - 涉及 DB schema 必須列 SQL DDL 含 index
    - 抽取來源檔必須寫絕對對應：來源路徑 → 目標路徑；禁止改來源 repo

  specs:
    - 使用英文撰寫（normative language：SHALL / MUST / WHEN / THEN）
    - 每個 Requirement 至少一個 Scenario，Scenario 用 exactly 4 hashtags（####）
    - 禁用 should / may / might / consider / possibly / TBD / TODO
    - MODIFIED 需求必須複製完整 requirement block 再編輯，不可只寫 delta
    - 邊界條件必寫：空輸入、最大限制、錯誤情境
    - 每個涉及 API 的 requirement 必須明確標示 HTTP method + path + status code

  tasks:
    - 以繁體中文撰寫
    - 每個 task 用 checkbox 格式：`- [ ] X.Y 任務描述`
    - 每個 task 必須標記 `[Tool: <agent>]`（copilot / sonnet / kimi / haiku）
    - 可並行任務加 `[P]` 標記
    - 每個 task 描述必須包含對應的 spec Requirement name 或 design Decision 標題
    - 每個 task 粒度：單人 30 分鐘內完成
    - TDD 模式下測試任務必須在實作任務之前
    - Review 任務獨立成 group
    - 本階段禁止抽 supastarter / thetu 應用程式碼，除非 change 名稱明確是 scaffold 或 extract
